name: Build from zip
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q elementpowers-full.zip
      - run: sed -i 's/loom_version=.*/loom_version=1.17/' elementpowers/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: elementpowers
      - uses: actions/upload-artifact@v4
        with:
          name: elementpowers-jar
          path: elementpowers/build/libs/*.jar
